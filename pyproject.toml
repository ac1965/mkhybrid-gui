[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mkhybrid-gui"
version = "0.1.0"
description = "macOS上のCD-ROMからWindows/Linuxでも読めるハイブリッドISOイメージを作成するGUIツール"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-qt>=4.2",
    "pyinstaller>=6.0",
]

[project.scripts]
mkhybrid-gui = "mkhybrid_gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
